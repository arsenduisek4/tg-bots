services:
  - type: worker
    name: tg-groq-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama3-70b-8192
      - key: SYSTEM_PROMPT
        value: Ты — полезный AI-ассистент. Отвечай кратко и по делу на русском языке.
