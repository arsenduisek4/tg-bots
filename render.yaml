services:
  - type: web
    name: tg-groq-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama3-8b-8192
      - key: SYSTEM_PROMPT
        value: Ты — полезный AI-ассистент. Отвечай кратко и по делу на русском языке.
